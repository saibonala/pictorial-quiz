<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pictorial Quiz</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280;
    --border: #e2e4e9; --accent: #4f46e5; --accent-text: #ffffff;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171b; --card: #1f2126; --text: #f0f0f2; --muted: #9aa0ab; --border: #33363f; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    padding-top: calc(1rem + env(safe-area-inset-top, 0px));
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; display: flex; align-items: center; gap: .4rem; }
  h2 { font-size: 1rem; margin: 0 0 .75rem; }
  .screen { display: none; }
  .screen.active { display: block; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }

  .btn {
    font: inherit; font-weight: 600; padding: .8rem 1.2rem; min-height: 48px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(.98); }

  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: .4rem;
    border: 2px dashed var(--border); border-radius: 12px; padding: 1.8rem 1rem;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  .dropzone.dragover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dropzone .dz-icon { font-size: 2rem; }
  .dropzone strong { color: var(--text); }

  .divider { text-align: center; color: var(--muted); font-size: .85rem; margin: .9rem 0; }
  textarea {
    width: 100%; min-height: 3.5rem; font: inherit; padding: .6rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical;
  }

  .thumb-grid { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .6rem; padding: 0; margin: 0; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .badge {
    position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.6); color: #fff;
    font-size: .7rem; font-weight: 700; padding: .1rem .4rem; border-radius: 6px;
  }
  .thumb .remove {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; line-height: 1; cursor: pointer;
  }
  .thumb button.pick { position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 0; background: none; cursor: pointer; }

  .numTile { display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .numTile .num { font-size: 1.6rem; font-weight: 700; color: var(--accent); pointer-events: none; }

  .back { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: .4rem 0; margin-bottom: .3rem; }

  .quizCard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; text-align: center; }
  .dots { display: flex; justify-content: center; gap: .4rem; margin-bottom: .8rem; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dots span.done { background: var(--accent); }
  .canvasWrap { position: relative; display: inline-block; max-width: 100%; }
  #quizCanvas { max-width: 100%; max-height: 55vh; border-radius: 10px; display: block; background: var(--bg); }
  .spinner {
    position: absolute; inset: 0; margin: auto; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage-label { margin: .8rem 0; font-weight: 600; color: var(--muted); }

  @media (max-width: 400px) {
    .thumb-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  }
</style>
</head>
<body>

<h1>🖼️ Pictorial Quiz</h1>

<main>
  <section id="upload-screen" class="screen active">
    <div class="card">
      <h2>Add images</h2>
      <label id="dropzone" class="dropzone" for="fileInput">
        <span class="dz-icon">📁</span>
        <span><strong>Tap to upload</strong> or drag & drop images here</span>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </label>
      <div class="divider">— or —</div>
      <textarea id="urlInput" placeholder="Paste image URLs, one per line"></textarea>
      <button id="addUrlsBtn" class="btn full" style="margin-top:.6rem">Add URL(s)</button>
    </div>

    <div class="card" id="listCard" hidden>
      <h2>Your images (<span id="imgCount">0</span>)</h2>
      <ul id="imgList" class="thumb-grid"></ul>
    </div>

    <button id="startQuizBtn" class="btn primary full" disabled>Start Quiz →</button>
  </section>

  <section id="picker-screen" class="screen">
    <button class="back" data-go="upload-screen">← Manage images</button>
    <h2>Choose an image</h2>
    <div id="numberGrid" class="thumb-grid"></div>
  </section>

  <section id="quiz-screen" class="screen">
    <button class="back" data-go="picker-screen">← Choose another</button>
    <div class="quizCard">
      <div id="stageDots" class="dots"></div>
      <div class="canvasWrap">
        <canvas id="quizCanvas"></canvas>
        <div id="loadingSpinner" class="spinner" hidden></div>
      </div>
      <div id="stageLabel" class="stage-label"></div>
      <button id="nextBtn" class="btn primary full">Next →</button>
    </div>
  </section>
</main>

<script>
const STORAGE_KEY = 'pictorialQuizImages';
const STAGES = [48, 64, 80, null]; // blocks across canvas width; null = full reveal
const CANVAS_MAX_W = 640;

let images = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let quizIndex = 0;
let stageIndex = 0;
let currentImg = null;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(images)); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function renderList() {
  const ul = document.getElementById('imgList');
  ul.innerHTML = '';
  images.forEach((img, i) => {
    const li = document.createElement('li');
    li.className = 'thumb';
    li.innerHTML = `<img src="${img.src}" alt="${img.name}"><span class="badge">${i + 1}</span>`;
    const rm = document.createElement('button');
    rm.className = 'remove';
    rm.textContent = '×';
    rm.setAttribute('aria-label', 'Remove image');
    rm.onclick = () => { images.splice(i, 1); save(); renderList(); };
    li.appendChild(rm);
    ul.appendChild(li);
  });
  document.getElementById('listCard').hidden = images.length === 0;
  document.getElementById('imgCount').textContent = images.length;
  document.getElementById('startQuizBtn').disabled = images.length === 0;
}

function handleFiles(fileList) {
  [...fileList].forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => {
      images.push({ src: reader.result, name: file.name });
      save(); renderList();
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('fileInput').addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

const dropzone = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); })
);
dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

document.getElementById('addUrlsBtn').addEventListener('click', () => {
  const box = document.getElementById('urlInput');
  box.value.split('\n').map(l => l.trim()).filter(Boolean).forEach(url => {
    images.push({ src: url, name: url.split('/').pop() || url });
  });
  box.value = '';
  save(); renderList();
});

document.getElementById('startQuizBtn').addEventListener('click', () => {
  renderPicker();
  showScreen('picker-screen');
});

function renderPicker() {
  const grid = document.getElementById('numberGrid');
  grid.innerHTML = '';
  images.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'thumb numTile';
    div.innerHTML = `<span class="num">${i + 1}</span><button class="pick" aria-label="Start quiz on image ${i + 1}"></button>`;
    div.querySelector('.pick').onclick = () => startQuiz(i);
    grid.appendChild(div);
  });
}

function renderDots() {
  const dots = document.getElementById('stageDots');
  dots.innerHTML = STAGES.map((_, i) => `<span class="${i <= stageIndex ? 'done' : ''}"></span>`).join('');
}

function startQuiz(i) {
  quizIndex = i;
  stageIndex = 0;
  document.getElementById('stageLabel').textContent = 'Loading...';
  document.getElementById('loadingSpinner').hidden = false;
  renderDots();
  showScreen('quiz-screen');
  currentImg = new Image();
  currentImg.onload = setupCanvas;
  currentImg.onerror = () => {
    document.getElementById('loadingSpinner').hidden = true;
    document.getElementById('stageLabel').textContent = "Couldn't load this image.";
  };
  currentImg.src = images[i].src;
}

function setupCanvas() {
  document.getElementById('loadingSpinner').hidden = true;
  const canvas = document.getElementById('quizCanvas');
  const w = Math.min(CANVAS_MAX_W, currentImg.naturalWidth || CANVAS_MAX_W);
  const h = Math.round(w * ((currentImg.naturalHeight || w) / (currentImg.naturalWidth || w)));
  canvas.width = w;
  canvas.height = h;
  renderQuizStage();
}

// Downscale the image to `blocks` px wide, then draw that blown back up with
// smoothing off — the classic mosaic/pixelate effect, more guessable early
// than a uniform blur since edges and colors stay legible per block.
function drawPixelated(canvas, img, blocks) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (blocks === null) {
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, w, h);
    return;
  }
  const smallW = blocks;
  const smallH = Math.max(1, Math.round(h * (blocks / w)));
  const off = document.createElement('canvas');
  off.width = smallW;
  off.height = smallH;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.drawImage(img, 0, 0, smallW, smallH);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, 0, 0, smallW, smallH, 0, 0, w, h);
}

function renderQuizStage() {
  const canvas = document.getElementById('quizCanvas');
  const blocks = STAGES[stageIndex];
  const revealed = blocks === null;
  drawPixelated(canvas, currentImg, blocks);
  renderDots();
  document.getElementById('stageLabel').textContent = '';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  nextBtn.textContent = revealed ? 'Choose another →' : 'Next →';
}

document.getElementById('nextBtn').addEventListener('click', () => {
  if (stageIndex < STAGES.length - 1) {
    stageIndex++;
    renderQuizStage();
  } else {
    renderPicker();
    showScreen('picker-screen');
  }
});

document.querySelectorAll('.back').forEach(b => {
  b.addEventListener('click', () => {
    const target = b.dataset.go;
    if (target === 'picker-screen') renderPicker();
    showScreen(target);
  });
});

renderList();
</script>
</body>
</html>
